# Gunun Maclari: sporekrani.com'dan bugun + 7 gunun listesini ceker (gorunmez tarayiciyla),
# beIN / S Sport akislariyla dogrular, data/ klasorune yazar ve siteyi yayinlar.
# Saatler UTC'dir (Turkiye = UTC+3).
name: Gunluk veri ve yayin

on:
  schedule:
    - cron: '10 21 * * *'   # 00:10 TSI - yeni gun
    - cron: '40 22 * * *'   # 01:40 TSI - ikinci deneme
    - cron: '0 4 * * *'     # 07:00 TSI
    - cron: '0 9 * * *'     # 12:00 TSI
    - cron: '0 14 * * *'    # 17:00 TSI
  push:
    branches: [main]
  workflow_dispatch:        # Actions sekmesinden elle calistirma

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gunluk-veri
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gorunmez tarayiciyi kur
        run: |
          pip install playwright
          # Sunucuda Google Chrome hazir; yoksa Playwright'in kendi Chromium'u kurulur.
          google-chrome --version || python -m playwright install --with-deps chromium

      - name: Gunlerin listesini cek
        id: cek
        continue-on-error: true   # veri cekilemese de site eski veriyle yayinda kalsin
        run: python scripts/veri_cek.py

      - name: Degistiyse kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Veride degisiklik yok."
          else
            git commit -m "Veri: $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Veri cekilemediyse uyar
        if: steps.cek.outcome == 'failure'
        run: |
          echo "::warning::Veri cekilemedi; site onceki veriyle yayinda. Ayrinti 'Gunlerin listesini cek' adiminda."

  yayinla:
    needs: guncelle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
