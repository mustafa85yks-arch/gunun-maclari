<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Günün Maçları</title>
  <meta name="description" content="Türkiye'de TV'de günün maçları">
  <meta name="theme-color" content="#f6f6f4">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Maçlar">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brandline">GÜNÜN MAÇLARI <span>· Türkiye</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="searchBtn" aria-label="Takım veya lig ara">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="favBtn" aria-label="Favoriler">★</button>
      </div>
    </header>

    <form class="search" id="searchForm" role="search" autocomplete="off" hidden>
      <input id="searchInput" type="search" list="teamSuggest" enterkeyhint="search"
             placeholder="Takım veya lig ara (ör. Galatasaray, NFL)" aria-label="Takım veya lig ara">
      <button class="pill-btn" type="submit">Ara</button>
    </form>

    <div class="bar" id="bar">
      <nav class="scroller days" id="days" aria-label="Gün seçimi"></nav>
      <div class="scroller chips" id="filters" aria-label="Filtreler"></div>
    </div>

    <main id="content"></main>

    <footer class="meta" id="meta"></footer>
  </div>

  <dialog id="favDialog" class="fav-dialog" aria-labelledby="favTitle">
    <div class="fav-head">
      <h2 id="favTitle">Favoriler</h2>
      <button class="pill-btn" id="favClose">Tamam</button>
    </div>
    <p class="fav-note">Favori maçlar en üstte ayrı bölümde görünür. Seçimler bu tarayıcıda saklanır.</p>

    <h3>Takımlar</h3>
    <div class="chips wrapchips" id="favTeams"></div>
    <form id="favTeamForm" class="fav-form" autocomplete="off">
      <input id="favTeamInput" list="teamSuggest" placeholder="Takım adı yaz (ör. Fenerbahçe)">
      <button class="pill-btn" type="submit">Ekle</button>
    </form>
    <datalist id="teamSuggest"></datalist>
    <p class="fav-note">Adı içeren her maç gelir: "Fenerbahçe" hem futbolu hem Fenerbahçe Beko'yu kapsar.</p>

    <h3>Ligler</h3>
    <div class="chips wrapchips" id="favLeagues"></div>
  </dialog>

  <script src="data.js?v=2"></script>
  <script src="api.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
